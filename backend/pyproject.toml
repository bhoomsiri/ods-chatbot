[project]
name = "ods-chatbot-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

# Heavy/optional deps are imported lazily and ship no type stubs.
[[tool.mypy.overrides]]
module = [
    "FlagEmbedding.*",
    "docling.*",
    "qdrant_client.*",
    "google.*",
    "google.generativeai.*",
    "openai.*",
    "pypdfium2.*",
    "yaml.*",
    "sacrebleu.*",
    "pythainlp.*",
    "bert_score.*",
    "ragas.*",
    "datasets.*",
    "langchain_anthropic.*",
    "langchain_core.*",
    "openpyxl.*",
]
ignore_missing_imports = true

# Operational CLI scripts (batch ingest, etc.) are not part of the typed app
# surface. The eval harness reuses their corpus-walk helpers, which pulls them
# into `mypy eval`; don't fail strict on them.
[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
